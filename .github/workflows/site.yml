name: site

on:
  push:
    branches: [main, redesign]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  # Never cancel a main run mid-deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Publish only the site files, never docs/ or CLAUDE.md.
      - name: Assemble _site
        run: |
          mkdir _site
          cp -r index.html 404.html styles.css robots.txt sitemap.xml assets _site/

      # Config turns off doctype-style only: Prettier writes <!doctype html> in lowercase.
      - name: Validate HTML
        run: npx --yes html-validate@11.23.0 --config .github/htmlvalidate.json _site/*.html

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          # mailto: is skipped by default. LinkedIn answers bots with HTTP 999.
          # Self-URLs point at the live site, which lags this build; local
          # files are checked through --root-dir instead.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/_site
            --exclude ^https://www\.linkedin\.com/
            --exclude ^https://icombe\.github\.io/
            _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lighthouse
        run: npx --yes @lhci/cli@0.16.1 autorun --config=.github/lighthouserc.json

      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: lhci-reports/
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
