<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Colors match the bg and accent tokens in styles.css; dark values follow the system theme like the site.
       No double hyphens inside XML comments: they break the file. -->
  <style>
    circle { fill: #f7f7f4; }
    text { fill: #3343a3; }
    @media (prefers-color-scheme: dark) {
      circle { fill: #151821; }
      text { fill: #a3b2ff; }
    }
  </style>
  <circle cx="50" cy="50" r="50"/>
  <text x="50" y="71" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="60" font-style="italic" text-anchor="middle">IC</text>
</svg>
